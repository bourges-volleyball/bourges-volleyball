<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration - Bourges Volley-Ball</title>
    <link rel="icon" href="/images/logo-bvb.png" />
    <!-- Decap reserve 300 px au logo de connexion et le cale a gauche ; le
         logo du club est carre, on le centre. Si Decap renomme cette classe,
         le logo retombe simplement a gauche. -->
    <style>
      [class*="CustomIconWrapper"] { text-align: center; }
    </style>
  </head>
  <body>
    <!-- Identification des benevoles, geree par Netlify -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Decap s'initialise de lui-meme des que son script est charge. On
         le retient (CMS_MANUAL_INIT) le temps de lui declarer la feuille
         de style de l'apercu : declaree apres l'initialisation, elle
         serait ignoree. CMS.init() est appele plus bas. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- L'interface d'administration elle-meme, servie par unpkg.

         L'attribut integrity est l'empreinte du fichier attendu : si unpkg
         renvoyait un jour autre chose que la version 3.3.3 d'origine, le
         navigateur refuserait de l'executer. Ce n'est pas une precaution
         theorique : ce script a, une fois charge, le droit d'ecrire dans tout
         le site au nom du benevole connecte.

         EN CAS DE CHANGEMENT DE VERSION, il faut recalculer l'empreinte,
         sinon l'administration ne s'ouvrira plus du tout :
           node -e "const{createHash}=require('crypto');fetch('https://unpkg.com/decap-cms@X.Y.Z/dist/decap-cms.js').then(r=>r.arrayBuffer()).then(b=>console.log('sha384-'+createHash('sha384').update(Buffer.from(b)).digest('base64')))"
    -->
    <script
      src="https://unpkg.com/decap-cms@3.3.3/dist/decap-cms.js"
      integrity="sha384-Ch3bpZcxxjHMuIde+QMTyDdxGqjtafFkpoGgvLjf50nHhptNH7bZyPTyKSkOvEo+"
      crossorigin="anonymous"
    ></script>

    <!-- Le volet d'apercu, a droite de l'editeur, est un cadre isole : il
         n'herite d'aucun style du site. Sans cette ligne il affiche le
         texte en Times New Roman sur fond blanc, ce qui ne ressemble a
         rien de ce que verront les visiteurs. -->
    <script>
      // La feuille est passee en contenu brut, pas en adresse : le volet
      // d'apercu est un cadre sans adresse propre (about:blank), ou un
      // <link href="/admin/apercu.css"> n'a aucune racine a laquelle se
      // rattacher et ne charge rien. On lit donc le fichier avant, puis on
      // initialise l'interface.
      fetch("/admin/apercu.css")
        .then(function (r) {
          return r.ok ? r.text() : "";
        })
        .catch(function () { return ""; })
        .then(function (css) {
          if (css) CMS.registerPreviewStyle(css, { raw: true });
          CMS.init();
        });
    </script>
  </body>
</html>
