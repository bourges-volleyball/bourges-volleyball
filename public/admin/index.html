<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Administration - Bourges Volley-Ball</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/favicon-96.png" type="image/png" sizes="96x96" />
    <!-- Ajoutee a l'ecran d'accueil d'un telephone, l'administration garde le
         logo du club et s'ouvre sur /admin/ (et non sur le site) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/admin/admin.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Admin BVB" />
    <meta name="theme-color" content="#0D0E11" />
    <!-- Decap reserve 300 px au logo de connexion et le cale a gauche ; le
         logo du club est carre, on le centre. Si Decap renomme cette classe,
         le logo retombe simplement a gauche. -->
    <style>
      [class*="CustomIconWrapper"] { text-align: center; }

      /* Habillage leger aux couleurs du site : polices Barlow, barre du haut
         sombre, boutons principaux en vert lime. Les zones de saisie restent
         claires, donc lisibles. Les noms de classes sont ceux de Decap 3.16 ;
         s'ils changent, l'administration retrouve son aspect d'origine.
         « :root » devant chaque regle : Decap ajoute ses styles apres
         celui-ci, a egalite il l'emporterait. */
      @font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(/admin/polices/barlow-latin-400-normal.woff2) format("woff2")}
      @font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(/admin/polices/barlow-latin-500-normal.woff2) format("woff2")}
      @font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(/admin/polices/barlow-latin-600-normal.woff2) format("woff2")}
      @font-face{font-family:"Barlow";font-weight:700;font-display:swap;src:url(/admin/polices/barlow-latin-700-normal.woff2) format("woff2")}
      @font-face{font-family:"Barlow Condensed";font-weight:800;font-display:swap;src:url(/admin/polices/barlow-condensed-latin-800-normal.woff2) format("woff2")}
      @font-face{font-family:"Barlow Semi Condensed";font-weight:600;font-display:swap;src:url(/admin/polices/barlow-semi-condensed-latin-600-normal.woff2) format("woff2")}

      :root body, :root button, :root input, :root select, :root textarea {
        font-family: "Barlow", "Helvetica Neue", Arial, sans-serif;
      }
      :root [class*="CollectionTopHeading"], :root [class*="SidebarHeading"],
      :root [class*="SearchResultHeading"], :root [class*="GroupHeading"] {
        font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 800;
        text-transform: uppercase; letter-spacing: .01em; line-height: 1;
      }
      :root [class*="CollectionTopHeading"] { font-size: 30px; }
      :root [class*="SidebarHeading"] { font-size: 26px; }
      :root [class*="FieldLabel"] { font-family: "Barlow Semi Condensed", sans-serif; font-weight: 600; letter-spacing: .1em; }

      /* Barre du haut, comme l'en-tete du site */
      :root header[class*="AppHeader"] { background: #0d0e11; box-shadow: none; border-bottom: 1px solid #282c34; }
      :root [class*="AppHeaderNavLink"] {
        color: #f4f4f2; font-family: "Barlow Semi Condensed", sans-serif; font-weight: 600;
        text-transform: uppercase; letter-spacing: .09em; font-size: 14px;
      }
      :root [class*="AppHeaderNavLink"] span { color: inherit; }
      :root [class*="AppHeaderNavLink"]:hover, :root [class*="AppHeaderNavLink"].header-link-active,
      :root [class*="AppHeaderNavLink"]:hover span, :root [class*="AppHeaderNavLink"].header-link-active span { color: #b4e600; }

      /* Pas de bouton Media : une photo envoyee par la est enregistree
         seule, sans contenu qui l'affiche, et la supprimer de la bibliotheque
         casserait les fiches qui s'en servent. Ajoutee depuis le formulaire
         d'un contenu, elle part avec lui. Le bouton Media est le seul
         <button> de la liste ; « Contenus » est un lien. */
      :root [class*="AppHeaderNavList"] li:has(> button[class*="AppHeaderButton"]),
      :root [class*="AppHeaderNavList"] button[class*="AppHeaderButton"] { display: none; }
      :root [class*="AppHeaderQuickNewButton"] { background: #b4e600; color: #101114; font-weight: 700; }
      :root [class*="AppHeaderQuickNewButton"]:hover { background: #96c200; color: #101114; }
      :root [class*="AppHeaderSiteLink"] { color: #9a9fa9; }
      :root [class*="AppHeaderSiteLink"]:hover { color: #f4f4f2; }

      /* Boutons principaux en vert lime */
      :root [class*="CollectionTopNewButton"], :root [class*="LoginButton"], :root [class*="PublishButton"] {
        background: #b4e600; color: #101114; font-weight: 700;
      }
      :root [class*="CollectionTopNewButton"]:hover, :root [class*="LoginButton"]:hover,
      :root [class*="PublishButton"]:hover { background: #96c200; color: #101114; }

      /* Colonne des collections : Decap la fige a l'ecran et la limite a
         « 100vh - 112 px ». Sur tablette, 100vh mesure l'ecran barre
         d'adresse du navigateur cachee : quand elle est affichee, le bas de
         la colonne (Reglages) passait sous le bord de l'ecran, sans moyen d'y
         descendre. 100svh : la hauteur visible, barre affichee. Un navigateur
         trop ancien pour svh garde la regle de Decap. */
      :root [class*="SidebarContainer"] { max-height: calc(100svh - 112px); }

      /* Rubrique ouverte dans la colonne de gauche : le lime du site, en
         version foncee sur fond clair, ou le lime pur ne se lirait pas */
      :root [class*="SidebarNavLink"].sidebar-active { color: #3d4d00; background: #f2f8dc; border-left-color: #b4e600; }
      /* Survol a la souris seulement : sur telephone, il resterait colle apres un toucher */
      @media (hover: hover) {
        :root [class*="SidebarNavLink"]:hover { color: #3d4d00; background: #f2f8dc; border-left-color: #b4e600; }
      }

      /* Ecran de connexion sur fond sombre, logo en blanc comme sur le site */
      :root [class*="StyledAuthenticationPage"] { background: #0d0e11; }
      :root [class*="StyledAuthenticationPage"] [class*="CustomIconWrapper"] img { filter: invert(1); mix-blend-mode: screen; }
      :root [class*="GoBackButtonStyle"] { color: #9a9fa9; }
      :root [class*="GoBackButtonStyle"]:hover { color: #f4f4f2; }

      /* Boutons Publier le site (/admin/publier.html), Commandes
         (/admin/commandes.html) et Guide (/admin/guide/).
         Ranges dans la barre du haut, juste avant « Nouveau », par le script
         en bas de page ; en attendant (ecran de connexion), ils flottent en
         haut a droite. */
      .liens-admin { position: fixed; right: 12px; top: 12px; z-index: 400; display: flex; gap: 8px; }
      .liens-admin[hidden] { display: none; }
      .liens-admin.dans-barre { position: static; margin-right: 10px; }
      .lien-admin {
        display: inline-flex; align-items: center; gap: 7px;
        text-decoration: none; white-space: nowrap;
        font: 700 14px/1 sans-serif; letter-spacing: .05em; text-transform: uppercase;
        padding: 9px 14px; border-radius: 5px;
        /* Commandes : bouton creux, comme sur le site (barre et connexion sont sombres) */
        background: transparent; color: #f4f4f2; border: 2px solid rgba(255, 255, 255, .5);
      }
      .lien-admin:hover, .lien-admin:focus-visible { background: #f4f4f2; color: #0d0e11; border-color: #f4f4f2; }
      /* Publier le site : l'action principale, en vert lime */
      .lien-admin.publier { background: #b4e600; color: #0d0e11; border-color: #b4e600; }
      .lien-admin.publier:hover, .lien-admin.publier:focus-visible { background: #0d0e11; color: #b4e600; border-color: #b4e600; }
      .lien-admin .rond {
        display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
        background: currentColor; font-size: 12px;
      }
      .lien-admin .rond b { color: #0d0e11; }
      .lien-admin.publier .rond b { color: #b4e600; }
      .lien-admin.publier:hover .rond b, .lien-admin.publier:focus-visible .rond b { color: #0d0e11; }
      .lien-admin:not(.publier):hover .rond b, .lien-admin:not(.publier):focus-visible .rond b { color: #f4f4f2; }
      /* Nombre de modifications enregistrees, pas encore en ligne */
      .lien-admin .nombre {
        min-width: 20px; padding: 3px 6px; border-radius: 10px; text-align: center;
        background: #0d0e11; color: #b4e600; font-size: 12px; letter-spacing: 0;
      }
      .lien-admin.publier:hover .nombre, .lien-admin.publier:focus-visible .nombre { background: #b4e600; color: #0d0e11; }
      /* Credits du mois epuises : le bouton reste, la page dit pourquoi */
      .lien-admin.publier.bloque { background: #3a2a00; color: #ffe3a3; border-color: #ffb020; }
      .lien-admin.publier.bloque .rond b { color: #3a2a00; }
      /* Libelles longs (« le site », « de la boutique », « d'utilisation ») sur grand
         ecran seulement : sur tablette, la barre debordait a droite et le
         menu du compte (Se deconnecter) sortait de l'ecran. Pour la meme
         raison, l'adresse du site s'efface sous 960 px. */
      @media (max-width: 1199px) {
        .lien-admin .long { display: none; }
      }
      @media (max-width: 959px) {
        :root [class*="AppHeaderSiteLink"] { display: none; }
      }
      @media (max-width: 599px) {
        .lien-admin { padding: 8px 10px; font-size: 13px; }
        /* Telephone : Commandes et Guide reduits a leur pastille */
        .lien-admin:not(.publier) > span:not(.rond) { display: none; }
      }
      /* Telephone : « Ajout rapide » laisse sa place au menu du compte.
         Chaque rubrique garde son propre bouton « + ... ». */
      @media (max-width: 479px) {
        :root [class*="AppHeaderQuickNewButton"] { display: none; }
      }

      /* Decap est prevu pour un ordinateur : son editeur impose 800 px de
         large, et l'apercu se tient a cote du formulaire. Sur telephone,
         tout debordait a droite et le bouton Publier sortait de l'ecran.
         Ces regles s'appuient sur les noms de classes de Decap 3.3.3 ;
         si une version future les renomme, l'administration revient
         simplement a son affichage d'origine, sans rien casser. */
      @media (max-width: 799px) {
        [class*="EditorContainer"],
        [class*="ToolbarContainer"] { min-width: 0 !important; }

        /* L'apercu passerait a 180 px de large : on garde le formulaire
           seul, en pleine largeur. L'apercu reste la sur ordinateur. */
        .SplitPane .Pane1 { width: 100% !important; }
        .SplitPane .Pane2,
        .SplitPane .Resizer { display: none !important; }
        /* Les deux boutons ronds pilotent cet apercu : sans lui, ils
           n'ont plus rien a commander. */
        [class*="EditorContainer"] [class*="ButtonRound"] { display: none !important; }

        /* Place dans la barre du haut pour Publier et Supprimer : on
           retire le libelle de la collection (la fleche de retour reste),
           le lien « Voir en direct » et le nom du site. */
        [class*="ToolbarSectionBackLink"] > div:not([class*="BackArrow"]),
        [class*="ToolbarSubSectionLast"],
        [class*="ToolbarSectionMeta"] { display: none !important; }
      }
    </style>
  </head>
  <body>
    <nav class="liens-admin" aria-label="Publication, commandes et guide">
      <a class="lien-admin publier" href="/admin/publier.html" target="_blank" rel="noopener"><span class="rond" aria-hidden="true"><b>↑</b></span><span>Publier<span class="long"> le site</span></span><span class="nombre" hidden></span></a>
      <a class="lien-admin" href="/admin/commandes.html" target="_blank" rel="noopener" aria-label="Commandes de la boutique"><span class="rond" aria-hidden="true"><b>€</b></span><span>Commandes<span class="long"> de la boutique</span></span></a>
      <a class="lien-admin" href="/admin/guide/" target="_blank" rel="noopener" aria-label="Guide d'utilisation"><span class="rond" aria-hidden="true"><b>?</b></span><span>Guide<span class="long"> d'utilisation</span></span></a>
    </nav>
    <script>
      // Les boutons vont dans la barre du haut de Decap des qu'elle existe,
      // et y reviennent si Decap la redessine (apres une connexion par exemple).
      // Classe [class*="AppHeaderActions"] de Decap 3.16 : si elle change, les
      // boutons restent simplement flottants en haut a droite.
      (function () {
        var liens = document.querySelector(".liens-admin");
        new MutationObserver(function () {
          var barre = document.querySelector('[class*="AppHeaderActions"]');
          // Connecte, mais sur une adresse que Decap ne connait pas (reste d'un
          // lien de connexion Netlify, ancien favori) : il afficherait
          // « Introuvable ». Retour a la liste des contenus. Ses adresses : #/,
          // #/collections/..., #/search/..., #/workflow, #/edit/...
          if (barre && !/^(#\/?)?$|^#\/(collections|search|workflow|edit)(\/|$)/.test(location.hash)) location.replace("#/");
          // Dans l'editeur, il n'y a plus de barre : flottants, les boutons
          // cacheraient la sienne (et sur telephone le bouton Publier)
          var editeur = !barre && document.querySelector('[class*="ToolbarContainer"]');
          if (liens.hidden !== !!editeur) liens.hidden = !!editeur;
          if (barre && liens.parentNode !== barre) {
            barre.prepend(liens);
            liens.classList.add("dans-barre");
          } else if (!barre && liens.parentNode !== document.body) {
            document.body.prepend(liens);
            liens.classList.remove("dans-barre");
          }
        }).observe(document.body, { childList: true, subtree: true });
      })();
    </script>

    <!-- Identification des benevoles, geree par Netlify -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <!-- Decap s'initialise de lui-meme des que son script est charge. On
         le retient (CMS_MANUAL_INIT) le temps de lui declarer la feuille
         de style de l'apercu : declaree apres l'initialisation, elle
         serait ignoree. CMS.init() est appele plus bas. -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- L'interface d'administration elle-meme, servie par unpkg.

         L'attribut integrity est l'empreinte du fichier attendu : si unpkg
         renvoyait un jour autre chose que la version 3.16.2 d'origine, le
         navigateur refuserait de l'executer. Ce n'est pas une precaution
         theorique : ce script a, une fois charge, le droit d'ecrire dans tout
         le site au nom du benevole connecte.

         EN CAS DE CHANGEMENT DE VERSION, il faut recalculer l'empreinte,
         sinon l'administration ne s'ouvrira plus du tout :
           node -e "const{createHash}=require('crypto');fetch('https://unpkg.com/decap-cms@X.Y.Z/dist/decap-cms.js').then(r=>r.arrayBuffer()).then(b=>console.log('sha384-'+createHash('sha384').update(Buffer.from(b)).digest('base64')))"
    -->
    <script
      src="https://unpkg.com/decap-cms@3.16.2/dist/decap-cms.js"
      integrity="sha384-tbnFsiSBvMm2vOLu70Mx7HlnMj6kXxR0Tdo0USlY9564mb1AyMnIdCjOZ738PWPr"
      crossorigin="anonymous"
    ></script>

    <!-- « Publier » devient « Enregistrer » : un enregistrement va sur la
         branche preparation (config.yml) et ne change pas le site. C'est le
         bouton « Publier le site » qui met tout en ligne d'un coup. Les
         chemins sont ceux des textes francais de Decap 3.16 ; un chemin qui
         disparait laisse simplement le texte d'origine. -->
    <script>
      (function () {
        var fr = CMS.getLocale("fr");
        var textes = {
          "editor.editorToolbar.publish": "Enregistrer",
          "editor.editorToolbar.publishing": "Enregistrement…",
          "editor.editorToolbar.publishNow": "Enregistrer maintenant",
          "editor.editorToolbar.published": "Enregistrée",
          "editor.editorToolbar.publishAndCreateNew": "Enregistrer et en créer une autre",
          "editor.editorToolbar.publishAndDuplicate": "Enregistrer et dupliquer",
          "editor.editorToolbar.deletePublishedEntry": "Supprimer",
          "editor.editor.onDeletePublishedEntry": "Supprimer cette fiche ? Elle quittera le site à la prochaine publication.",
          "editor.editor.onDeleteWithUnsavedChanges": "Supprimer cette fiche, et les modifications pas encore enregistrées ? Elle quittera le site à la prochaine publication.",
          "ui.toast.entryPublished": "Enregistré. Le site changera quand quelqu'un cliquera « Publier le site ».",
          "ui.toast.onFailToPublishEntry": "Échec de l'enregistrement : %{details}",
        };
        Object.keys(textes).forEach(function (chemin) {
          var cles = chemin.split("."), o = fr, i = 0;
          for (; o && i < cles.length - 1; i++) o = o[cles[i]];
          if (o && typeof o[cles[i]] === "string") o[cles[i]] = textes[chemin];
        });
      })();
    </script>

    <!-- Bouton « Publier le site » : le nombre de modifications enregistrees
         qui attendent, et l'alerte quand les credits Netlify du mois sont
         epuises (netlify/functions/publier.mjs). Relu a la connexion, apres
         chaque enregistrement, a chaque changement de page de Decap (une
         suppression y ramene a la liste) et au retour sur l'onglet. -->
    <script>
      (function () {
        var bouton = document.querySelector(".lien-admin.publier");
        var nombre = bouton.querySelector(".nombre");
        var attente;
        function actualiser() {
          clearTimeout(attente);
          // GitHub met un instant a montrer le dernier enregistrement
          attente = setTimeout(function () {
            var u = window.netlifyIdentity && netlifyIdentity.currentUser();
            if (!u) return;
            u.jwt().then(function (jeton) {
              return fetch("/.netlify/functions/publier", { headers: { authorization: "Bearer " + jeton } });
            }).then(function (r) {
              return r.ok ? r.json() : null;
            }).then(function (e) {
              if (!e) return;
              // Branche preparation creee a l'instant : Decap doit la relire (une fois)
              if (e.creee && !sessionStorage.getItem("preparation-creee")) {
                sessionStorage.setItem("preparation-creee", "1");
                return location.reload();
              }
              var n = e.modifications.length;
              nombre.textContent = n;
              nombre.hidden = !n;
              var bloque = !!e.credits && !e.credits.permis;
              bouton.classList.toggle("bloque", bloque);
              bouton.title = bloque
                ? "Plus de crédits Netlify ce mois-ci : la publication attendra."
                : n ? n + " modification" + (n > 1 ? "s" : "") + " enregistrée" + (n > 1 ? "s" : "") + ", pas encore sur le site" : "Rien en attente";
            }).catch(function () {});
          }, 1500);
        }
        if (window.netlifyIdentity) {
          netlifyIdentity.on("init", actualiser);
          netlifyIdentity.on("login", actualiser);
        }
        CMS.registerEventListener({ name: "postSave", handler: actualiser });
        window.addEventListener("hashchange", actualiser);
        window.addEventListener("focus", actualiser);
      })();
    </script>

    <!-- Apercu des photos de l'accueil : la photo telle qu'elle apparaitra,
         sur ordinateur et sur telephone, avec le cadrage et la luminosite
         choisis. Memes valeurs que les classes .cadrage-* et .lum-* de
         src/components/Hero.astro : a changer aux deux endroits. -->
    <script>
      var CADRAGES = {
        centre: "50% 50%", haut: "50% 0%", bas: "50% 100%", gauche: "0% 50%", droite: "100% 50%",
        "haut-gauche": "0% 0%", "haut-droite": "100% 0%", "bas-gauche": "0% 100%", "bas-droite": "100% 100%",
      };
      var LUMIERES = { claire: 0.95, normale: 0.82, sombre: 0.68 };

      var ApercuDiaporama = createClass({
        getInitialState: function () { return { l: 0, h: 0 }; },
        render: function () {
          var self = this;
          var data = this.props.entry.get("data");
          var photo = data.get("photo");
          var champ = this.props.fields.find(function (f) { return f.get("name") === "photo"; });
          var src = photo ? String(this.props.getAsset(photo, champ)) : "";
          var position = CADRAGES[data.get("cadrage")] || CADRAGES.centre;
          var filtre = "brightness(" + (LUMIERES[data.get("luminosite")] || LUMIERES.normale) + ") contrast(1.05) saturate(0.85)";

          function ecran(titre, largeur, format) {
            return h("figure", { style: { margin: "0 0 1.5rem" } },
              h("figcaption", { style: { font: "600 12px/1.4 sans-serif", letterSpacing: ".12em", textTransform: "uppercase", color: "#9a9fa9", marginBottom: "6px" } }, titre),
              h("div", { style: { position: "relative", width: largeur, maxWidth: "100%", aspectRatio: format, overflow: "hidden", background: "#15171c" } },
                src && h("img", {
                  src: src,
                  onLoad: function (e) { self.setState({ l: e.target.naturalWidth, h: e.target.naturalHeight }); },
                  style: { position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", objectPosition: position, filter: filtre },
                }),
                h("div", { style: { position: "absolute", inset: 0, background: "linear-gradient(to top, rgba(9,10,13,.92) 0%, rgba(9,10,13,.6) 38%, rgba(9,10,13,.1) 72%, rgba(9,10,13,.3) 100%)" } }),
                h("div", { style: { position: "absolute", left: "6%", bottom: "8%", color: "#f4f4f2", font: "800 clamp(18px, 5vw, 40px)/1 sans-serif", textTransform: "uppercase" } }, "Bourges Volley-Ball")
              )
            );
          }

          // Une photo trop petite est etiree sur les grands ecrans, donc floue
          var alertes = [];
          if (this.state.l && this.state.l < 1600) alertes.push("Photo de " + this.state.l + " × " + this.state.h + " px : elle sera floue sur un grand écran. Il faut 1600 px de large au moins, idéalement 2400. Envoyez la photo d’origine : une photo passée par WhatsApp ou Messenger est réduite.");
          if (this.state.h > this.state.l) alertes.push("Photo en hauteur : sur ordinateur, seule une bande horizontale sera visible. Préférez une photo en largeur.");

          return h("div", { style: { padding: "1rem", background: "#0d0e11", minHeight: "100%" } },
            alertes.map(function (t, i) {
              return h("p", { key: i, style: { margin: "0 0 1rem", padding: ".75rem 1rem", background: "#3a2a00", borderLeft: "4px solid #ffb020", color: "#ffe3a3", font: "14px/1.45 sans-serif" } }, t);
            }),
            ecran("Sur ordinateur", "100%", "1440 / 650"),
            ecran("Sur téléphone", "240px", "375 / 585")
          );
        },
      });
      CMS.registerPreviewTemplate("diaporama", ApercuDiaporama);
    </script>

    <!-- Le volet d'apercu, a droite de l'editeur, est un cadre isole : il
         n'herite d'aucun style du site. Sans cette ligne il affiche le
         texte en Times New Roman sur fond blanc, ce qui ne ressemble a
         rien de ce que verront les visiteurs. -->
    <script>
      // La feuille est passee en contenu brut, pas en adresse : le volet
      // d'apercu est un cadre sans adresse propre (about:blank), ou un
      // <link href="/admin/apercu.css"> n'a aucune racine a laquelle se
      // rattacher et ne charge rien. On lit donc le fichier avant, puis on
      // initialise l'interface.
      fetch("/admin/apercu.css")
        .then(function (r) {
          return r.ok ? r.text() : "";

        .catch(function () { return ""; })
        .then(function (css) {

          css = css.replace(/url\(\//g, "url(" + location.origin + "/");
