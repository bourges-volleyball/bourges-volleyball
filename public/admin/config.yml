# Interface d'administration du site du Bourges Volley-Ball.
# Ce fichier doit rester en accord avec src/content.config.ts :
# un champ ajoute ici sans y etre declare la-bas sera ignore par le site.

backend:
  name: git-gateway
  branch: main

# Permet d'essayer l'administration sur son ordinateur, sans deployer.
# Decap ignore ce reglage des que le site n'est plus sur localhost :
# en ligne, c'est toujours git-gateway et Netlify Identity qui s'appliquent.
# Pour l'utiliser : npm run admin (dans un terminal) puis npm run dev.
local_backend: true

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: "fr"

# Logo sur l'ecran de connexion, et lien "Voir le site" en haut de l'interface.
# A changer le jour ou le club a son nom de domaine.
logo_url: "/images/logo-bvb.png"
site_url: "https://bourges-volleyball.netlify.app"

# Chaque enregistrement cree une version : rien n'est jamais perdu.
publish_mode: simple

collections:
  - name: "actus"
    label: "Actualités"
    label_singular: "une actualité"
    folder: "src/content/actus"
    create: true
    slug: "{{slug}}"
    summary: "{{titre}} - {{date}}"
    sortable_fields: ["date", "titre"]
    # Comme le diaporama : les images vont dans src/images/actus, ou le site
    # les optimise (celles de public/ seraient servies a leur poids d'origine).
    media_folder: "../../images/actus"
    public_folder: "../../images/actus"
    fields:
      - { name: "titre", label: "Titre", widget: "string" }
      - {
          name: "date",
          label: "Date de publication",
          widget: "datetime",
          date_format: "DD/MM/YYYY",
          time_format: false,
          format: "YYYY-MM-DD",
        }
      - {
          name: "chapo",
          label: "Résumé",
          widget: "text",
          hint: "Deux lignes maximum. Il s'affiche sous le titre, sur la page Actualités et en tête de l'article.",
        }
      - {
          name: "image",
          label: "Photo de une",
          widget: "image",
          required: false,
          hint: "Format paysage, 1200 px de large minimum. Une affiche peut être en portrait ou carrée : cochez alors la case ci-dessous.",
        }
      - {
          name: "affiche",
          label: "C'est une affiche",
          widget: "boolean",
          default: false,
          hint: "Cochée, l'image n'est jamais recadrée : elle apparaît en entier, et s'ouvre en grand d'un clic dans l'article.",
        }
      - {
          name: "brouillon",
          label: "Brouillon",
          widget: "boolean",
          default: false,
          hint: "Cochée, l'article n'apparaît pas sur le site.",
        }
      - { name: "body", label: "Texte", widget: "markdown" }

  - name: "diaporama"
    label: "Photos de l'accueil"
    label_singular: "une photo"
    description: "Les photos qui défilent en haut de la page d'accueil. Trois à cinq photos, format paysage, 1600 px de large minimum. Le site les assombrit lui-même pour que le texte reste lisible."
    folder: "src/content/diaporama"
    create: true
    identifier_field: "alt"
    slug: "{{slug}}"
    summary: "{{ordre}} - {{alt}}"
    sortable_fields: ["ordre"]
    # Chemins relatifs au dossier des fiches : les photos vont dans
    # src/images/diaporama, ou le site peut les optimiser (celles de
    # public/ sont servies telles quelles, a leur poids d'origine).
    media_folder: "../../images/diaporama"
    public_folder: "../../images/diaporama"
    fields:
      - {
          name: "photo",
          label: "Photo",
          widget: "image",
          hint: "Format paysage, 1600 px de large au moins, idéalement 2400. Envoyez la photo d’origine : une photo passée par WhatsApp ou Messenger est réduite et devient floue en grand. L’aperçu à droite prévient si elle est trop petite.",
        }
      - {
          name: "alt",
          label: "Ce que montre la photo",
          widget: "string",
          hint: "Quelques mots, par exemple « Attaque au filet ». Lu aux personnes aveugles, et sert de nom à la photo dans cette liste.",
        }
      # Reglages visibles en direct dans l'apercu a droite (public/admin/index.html)
      - {
          name: "cadrage",
          label: "Cadrage",
          widget: "select",
          default: "centre",
          hint: "La partie de la photo à garder quand l'écran la recoupe. Regardez l'aperçu à droite : ordinateur et téléphone ne coupent pas pareil.",
          options:
            [
              { label: "Centre", value: "centre" },
              { label: "Haut (garder les têtes)", value: "haut" },
              { label: "Bas", value: "bas" },
              { label: "Gauche", value: "gauche" },
              { label: "Droite", value: "droite" },
              { label: "En haut à gauche", value: "haut-gauche" },
              { label: "En haut à droite", value: "haut-droite" },
              { label: "En bas à gauche", value: "bas-gauche" },
              { label: "En bas à droite", value: "bas-droite" },
            ],
        }
      - {
          name: "luminosite",
          label: "Luminosité",
          widget: "select",
          default: "normale",
          hint: "Plus claire pour une photo sombre de gymnase ; plus sombre si le titre se lit mal.",
          options:
            [
              { label: "Plus claire", value: "claire" },
              { label: "Normale", value: "normale" },
              { label: "Plus sombre", value: "sombre" },
            ],
        }
      - {
          name: "ordre",
          label: "Ordre",
          widget: "number",
          value_type: "int",
          default: 10,
          hint: "La photo 1 passe en premier.",
        }

  # Textes fixes : on les modifie, on ne les supprime pas (le site en a besoin).
  - name: "pages"
    label: "Textes des pages"
    delete: false
    files:
      - name: "accueil"
        label: "Accueil : texte du haut"
        file: "src/content/pages/accueil.md"
        fields:
          - { name: "bandeau", label: "Bandeau blanc au-dessus du titre", widget: "string" }
          - { name: "titre", label: "Titre, 1re ligne", widget: "string", hint: "Court : le titre s'affiche en très grand." }
          - { name: "titreSuite", label: "Titre, 2e ligne", widget: "string" }
          - { name: "motFort", label: "Mot en vert, à la fin de la 2e ligne", widget: "string", hint: "Un seul mot, deux au plus." }
          - { name: "accroche", label: "Phrase en gras sous le titre", widget: "text" }
          - { name: "texte", label: "Texte sous la phrase en gras", widget: "text" }
      - name: "le-club"
        label: "Le club : histoire et palmarès"
        file: "src/content/pages/le-club.md"
        fields:
          - { name: "surtitre", label: "Petit texte au-dessus du titre", widget: "string" }
          - { name: "intro", label: "Présentation du club", widget: "text" }
          - name: "chiffres"
            label: "Chiffres clés"
            label_singular: "un chiffre"
            widget: "list"
            summary: "{{fields.valeur}} {{fields.legende}}"
            hint: "Quatre chiffres tombent juste sur ordinateur."
            fields:
              - { name: "valeur", label: "Chiffre", widget: "string", hint: "Par exemple 162, ou 60+." }
              - { name: "legende", label: "Légende", widget: "string" }
          - name: "histoire"
            label: "Notre histoire"
            label_singular: "une étape"
            widget: "list"
            summary: "{{fields.date}} - {{fields.titre}}"
            hint: "Dans l'ordre chronologique. On réordonne en faisant glisser les étapes."
            fields:
              - { name: "date", label: "Date ou période", widget: "string", hint: "Par exemple 2007, 2021-2022 ou Aujourd'hui." }
              - { name: "titre", label: "Titre", widget: "string" }
              - { name: "texte", label: "Texte", widget: "text" }
          - name: "palmares"
            label: "Palmarès"
            label_singular: "un titre"
            widget: "list"
            summary: "{{fields.annee}} - {{fields.titre}}"
            fields:
              - { name: "annee", label: "Année ou saison", widget: "string" }
              - { name: "titre", label: "Titre remporté", widget: "string" }
              - { name: "detail", label: "Précision", widget: "string", hint: "Par exemple : Remportée par les filles." }
          - { name: "notePalmares", label: "Remarque sous le palmarès", widget: "text", required: false, hint: "Laissée vide, elle ne s'affiche pas." }

  - name: "equipes"
    label: "Équipes"
    label_singular: "une équipe"
    folder: "src/content/equipes"
    create: true
    slug: "{{slug}}"
    summary: "{{nom}} - {{niveau}}"
    sortable_fields: ["ordre", "nom"]
    # Images optimisees par le site : rangees dans src/images/equipes
    media_folder: "../../images/equipes"
    public_folder: "../../images/equipes"
    fields:
      - { name: "nom", label: "Nom de l'équipe", widget: "string" }
      - {
          name: "ordre",
          label: "Ordre d'affichage",
          widget: "number",
          value_type: "int",
          hint: "1 en premier. Classez du plus jeune au plus âgé.",
        }
      - {
          name: "ageMin",
          label: "Âge minimum",
          widget: "number",
          value_type: "int",
          hint: "Sert au sélecteur d'âge de la page Nous rejoindre.",
        }
      - {
          name: "ageMax",
          label: "Âge maximum",
          widget: "number",
          value_type: "int",
          hint: "Mettez 99 s'il n'y a pas de limite haute.",
        }
      - {
          name: "niveau",
          label: "Niveau",
          widget: "string",
          hint: "Exemple : Prénationale, Régionale, Championnat départemental.",
        }
      - name: "creneaux"
        label: "Créneaux d'entraînement"
        widget: "list"
        summary: "{{fields.jour}} {{fields.horaire}}"
        fields:
          - { name: "jour", label: "Jour", widget: "string" }
          - { name: "horaire", label: "Horaire", widget: "string" }
      - { name: "gymnase", label: "Gymnase", widget: "string" }
      - { name: "coach", label: "Encadrement", widget: "string", required: false }
      - {
          name: "tarif",
          label: "Tarif de la saison (euros)",
          widget: "number",
          value_type: "int",
        }
      - {
          name: "photo",
          label: "Photo d'équipe",
          widget: "image",
          required: false,
          hint: "Une photo de groupe, en largeur de préférence. Elle s'affiche en entier en tête de la fiche de l'équipe, et sert de fond à sa carte sur la page Les équipes.",
        }
      - name: "effectif"
        label: "Effectif"
        widget: "list"
        required: false
        summary: "{{fields.numero}} {{fields.nom}} {{fields.poste}}"
        hint: "Laissez vide si vous ne souhaitez pas publier la composition."
        fields:
          - { name: "nom", label: "Nom", widget: "string" }
          - {
              name: "poste",
              label: "Poste",
              widget: "select",
              required: false,
              options:
                [
                  "Passeur",
                  "Central",
                  "Pointu",
                  "Réceptionneur-attaquant",
                  "Libéro",
                ],
            }
          - { name: "numero", label: "Numéro", widget: "number", value_type: "int", required: false }
      - {
          name: "body",
          label: "Présentation (optionnel)",
          widget: "markdown",
          required: false,
          hint: "Texte libre affiché sur la fiche. Utile quand un groupe aligne plusieurs équipes : listez-les ici.",
        }

  - name: "matchs"
    label: "Matchs"
    label_singular: "un match"
    description: "Les matchs FFVolley (seniors et M18) arrivent tout seuls, avec leurs scores et le classement : ne les saisissez pas ici. Cette rubrique sert aux autres : Ufolep, coupes, amicaux, tournois. Rouvrez le match après la rencontre pour ajouter le score."
    folder: "src/content/matchs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{adversaire}}"
    summary: "{{date}} - {{adversaire}}"
    sortable_fields: ["date"]
    fields:
      - {
          name: "date",
          label: "Date et heure",
          widget: "datetime",
          date_format: "DD/MM/YYYY",
          time_format: "HH:mm",
          picker_utc: false,
        }
      - { name: "equipe", label: "Équipe concernée", widget: "string", hint: "Toujours écrit pareil (par exemple « Ufolep ») : c'est ce nom qui range le match dans l'onglet de l'équipe, page Matchs." }
      - { name: "adversaire", label: "Adversaire", widget: "string" }
      - {
          name: "domicile",
          label: "Match à domicile",
          widget: "boolean",
          default: true,
        }
      - { name: "competition", label: "Compétition", widget: "string" }
      - { name: "lieu", label: "Lieu", widget: "string", required: false }
      - {
          name: "scoreNous",
          label: "Sets gagnés par Bourges",
          widget: "number",
          value_type: "int",
          required: false,
          hint: "Laissez vide tant que le match n'est pas joué.",
        }
      - {
          name: "scoreEux",
          label: "Sets gagnés par l'adversaire",
          widget: "number",
          value_type: "int",
          required: false,
        }
      - {
          name: "sets",
          label: "Détail des sets",
          widget: "string",
          required: false,
          hint: "Score de l'équipe qui reçoit en premier, sets séparés par une virgule. Exemple : 25:22, 21:25, 25:19, 25:20",
        }

  - name: "partenaires"
    label: "Partenaires"
    label_singular: "un partenaire"
    folder: "src/content/partenaires"
    create: true
    slug: "{{slug}}"
    summary: "{{nom}} - {{niveau}}"
    # Images optimisees par le site : rangees dans src/images/partenaires
    media_folder: "../../images/partenaires"
    public_folder: "../../images/partenaires"
    fields:
      - { name: "nom", label: "Nom", widget: "string" }
      - {
          name: "niveau",
          label: "Niveau de partenariat",
          widget: "select",
          options:
            [
              { label: "Partenaire principal", value: "principal" },
              { label: "Partenaire officiel", value: "officiel" },
              { label: "Institutionnel", value: "institutionnel" },
            ],
        }
      - {
          name: "logo",
          label: "Logo",
          widget: "image",
          required: false,
          hint: "Logo sur fond blanc ou transparent.",
        }
      - {
          name: "lien",
          label: "Site web",
          widget: "string",
          required: false,
          pattern: ["^https?://", "L'adresse doit commencer par https://"],
          hint: "L'adresse du site du partenaire, en entier (https://...). Rempli, le logo devient cliquable et ouvre son site dans un nouvel onglet.",
        }
      - { name: "ordre", label: "Ordre", widget: "number", value_type: "int", default: 10 }

  # Une fiche par vente, comme un formulaire HelloAsso. Le site prend la
  # commande, HelloAsso n'encaisse que le paiement. Les commandes payees se
  # consultent sur /admin/commandes.html.
  - name: "boutique"
    label: "Boutique"
    label_singular: "une vente"
    description: "Tout ce qui se paie sur le site : équipements, adhésions, stages, tournois, buvette. Les commandes payées se consultent sur la page Commandes (adresse du site suivie de /admin/commandes.html)."
    folder: "src/content/boutique"
    create: true
    slug: "{{slug}}"
    identifier_field: "nom"
    summary: "{{categorie}} - {{nom}}"
    sortable_fields: ["categorie", "nom", "ordre"]
    # Images optimisees par le site : rangees dans src/images/boutique
    media_folder: "../../images/boutique"
    public_folder: "../../images/boutique"
    fields:
      - { name: "nom", label: "Nom de la vente", widget: "string", hint: "Par exemple : Stage jeunes Toussaint 2026." }
      - {
          name: "categorie",
          label: "Rayon",
          widget: "select",
          options:
            [
              { label: "Équipements", value: "equipement" },
              { label: "Adhésions", value: "adhesion" },
              { label: "Stages", value: "stage" },
              { label: "Tournois", value: "tournoi" },
              { label: "Buvette", value: "buvette" },
            ],
        }
      - { name: "description", label: "Description", widget: "text", hint: "Ce qui est vendu, pour qui, et les consignes utiles." }
      - {
          name: "image",
          label: "Visuel",
          widget: "image",
          required: false,
          hint: "Affiche ou photo de la vente. Sans visuel, la boutique montre la photo du premier article.",
        }
      - { name: "quand", label: "Date et horaires", widget: "string", required: false, hint: "Pour un stage ou un tournoi. Par exemple : Du 26 au 30 octobre, de 8h30 à 17h." }
      - { name: "lieu", label: "Lieu", widget: "string", required: false }
      - {
          name: "ouvertureLe",
          label: "Ouverture",
          widget: "datetime",
          date_format: "DD/MM/YYYY",
          time_format: false,
          format: "YYYY-MM-DD",
          required: false,
          hint: "Laissée vide, la vente est ouverte tout de suite.",
        }
      - {
          name: "fermetureLe",
          label: "Dernier jour pour commander",
          widget: "datetime",
          date_format: "DD/MM/YYYY",
          time_format: false,
          format: "YYYY-MM-DD",
          required: false,
          hint: "Le soir de cette date, la vente se ferme toute seule. Laissée vide, elle reste ouverte (buvette).",
        }
      - {
          name: "nominatif",
          label: "Demander le nom de chaque participant",
          widget: "boolean",
          default: false,
          hint: "À cocher pour une adhésion, un stage ou un tournoi : chaque place achetée demande le nom et le prénom de la personne, puis les questions ci-dessous.",
        }
      - name: "questions"
        label: "Questions pour chaque participant"
        label_singular: "une question"
        widget: "list"
        required: false
        summary: "{{fields.libelle}}"
        hint: "Seulement si la case ci-dessus est cochée. Toutes les réponses sont obligatoires. N'en demandez pas plus que nécessaire."
        fields:
          - { name: "libelle", label: "Question", widget: "string", hint: "Par exemple : Téléphone du licencié." }
          - {
              name: "type",
              label: "Réponse",
              widget: "select",
              default: "texte",
              options: [{ label: "Texte libre", value: "texte" }, { label: "Oui ou non", value: "ouinon" }],
            }
      - name: "articles"
        label: "Articles ou tarifs"
        label_singular: "un article"
        widget: "list"
        summary: "{{fields.nom}} - {{fields.prix}} €"
        hint: "Au moins un. Pour une adhésion, un article par tarif. Pour un stage, un seul article suffit : le prix d'une journée, le nombre de jours et les options (repas)."
        fields:
          - { name: "nom", label: "Nom", widget: "string" }
          - { name: "description", label: "Description", widget: "string", required: false }
          - { name: "prix", label: "Prix (euros)", widget: "number", value_type: "float", step: 0.01, min: 0.5, hint: "Avec un point pour les centimes : 17.99" }
          - { name: "photo", label: "Photo", widget: "image", required: false, hint: "Format carré de préférence." }
          - {
              name: "places",
              label: "Nombre de places",
              widget: "number",
              value_type: "int",
              min: 0,
              required: false,
              hint: "Laissé vide : pas de limite. Rempli, l'article affiche les places restantes et se ferme une fois complet.",
            }
          - {
              name: "tailles",
              label: "Tailles",
              widget: "list",
              required: false,
              hint: "Séparées par des virgules, par exemple : S, M, L, XL. Demandée pour chaque article commandé. Laissez vide pour un sac, une boisson, une place.",
            }
          - {
              name: "jours",
              label: "Stage : nombre de jours",
              widget: "number",
              value_type: "int",
              min: 1,
              max: 31,
              required: false,
              hint: "Pour un stage à la journée : le prix ci-dessus est celui d'une journée, et chaque participant choisit de 1 jour à ce nombre. Laissé vide pour tout le reste.",
            }
          - name: "options"
            label: "Options pour chaque participant"
            label_singular: "une option"
            widget: "list"
            required: false
            summary: "{{fields.nom}} - {{fields.prix}} €"
            hint: "Cases à cocher proposées à chaque participant, par exemple le repas du midi."
            fields:
              - { name: "nom", label: "Nom", widget: "string", hint: "Par exemple : Repas du midi." }
              - { name: "prix", label: "Prix (euros)", widget: "number", value_type: "float", step: 0.01, min: 0.5 }
              - {
                  name: "parJour",
                  label: "Comptée chaque jour",
                  widget: "boolean",
                  default: false,
                  hint: "Cochée : le prix est multiplié par le nombre de jours choisis (un repas par jour). Décochée : payée une seule fois.",
                }
              - {
                  name: "offerteDes",
                  label: "Offerte à partir de (jours)",
                  widget: "number",
                  value_type: "int",
                  min: 1,
                  required: false,
                  hint: "Par exemple 5 : l'option est gratuite pour un participant inscrit 5 jours. Laissé vide : toujours payante.",
                }
      - { name: "ordre", label: "Ordre", widget: "number", value_type: "int", default: 10, hint: "1 en premier dans son rayon." }

  - name: "evenements"
    label: "Agenda"
    label_singular: "un événement"
    description: "Les rendez-vous du club : tournois, stages, assemblée générale, soirées, repas. Pas les matchs : ils sont sur la page Matchs. Un événement passé disparaît tout seul de l'agenda."
    folder: "src/content/evenements"
    create: true
    slug: "{{slug}}"
    summary: "{{date}} - {{titre}}"
    sortable_fields: ["date", "titre"]
    fields:
      - { name: "titre", label: "Titre", widget: "string" }
      - {
          name: "date",
          label: "Date et heure",
          widget: "datetime",
          date_format: "DD/MM/YYYY",
          time_format: "HH:mm",
          picker_utc: false,
        }
      - {
          name: "dateFin",
          label: "Date de fin",
          widget: "datetime",
          date_format: "DD/MM/YYYY",
          time_format: false,
          required: false,
          hint: "À remplir uniquement si l'événement dure plusieurs jours.",
        }
      - {
          name: "avecHeure",
          label: "Afficher l'heure",
          widget: "boolean",
          default: true,
          hint: "Décochez pour un stage ou un week-end, où l'heure n'a pas de sens.",
        }
      - { name: "lieu", label: "Lieu", widget: "string", required: false }
      - {
          name: "type",
          label: "Type",
          widget: "select",
          default: "autre",
          options:
            [
              { label: "Tournoi", value: "tournoi" },
              { label: "Vie du club", value: "vie du club" },
              { label: "Stage", value: "stage" },
              { label: "Autre", value: "autre" },
            ],
        }
      - { name: "description", label: "Description", widget: "text" }
      - { name: "lien", label: "Lien (inscription, infos)", widget: "string", required: false, pattern: ["^https?://", "L'adresse doit commencer par https://"], hint: "Par exemple la page de la vente dans la boutique, pour s'inscrire à un tournoi ou un stage. Affiche le bouton « S'inscrire ou en savoir plus »." }

  # Reglages lus par scripts/ffvb.mjs avant chaque construction du site
  - name: "reglages"
    label: "Réglages"
    description: "À toucher une fois par saison, en septembre, quand la FFVolley publie les nouvelles poules. Voir le guide, partie « Les matchs »."
    editor: { preview: false }
    files:
      - name: "ffvb"
        label: "Matchs FFVolley : saison et poules"
        file: "src/data/ffvb-poules.json"
        fields:
          - name: "poules"
            label: "Équipes suivies"
            label_singular: "une équipe"
            widget: "list"
            summary: "{{fields.equipe}}"
            hint: "Une ligne par équipe engagée en championnat FFVolley. L'ordre est celui des onglets de la page Matchs."
            fields:
              - { name: "equipe", label: "Équipe", widget: "string", hint: "Le nom de l'onglet sur la page Matchs. Par exemple : Seniors masculins." }
              - { name: "competition", label: "Compétition", widget: "string", hint: "Par exemple : Prénationale masculine." }
              - {
                  name: "adresse",
                  label: "Adresse de la poule sur ffvbbeach.org",
                  widget: "string",
                  pattern: ["^https?://(www\\.)?ffvbbeach\\.org/ffvbapp/resu/vbspo_calendrier\\.php\\?(?=.*saison=)(?=.*codent=)(?=.*poule=)","Collez l'adresse de la page Calendrier de la poule, sur ffvbbeach.org"],
                  hint: "Sur ffvbbeach.org, ouvrez le calendrier de la poule de l'équipe et copiez l'adresse de la page. Elle contient la saison, la ligue et la poule : c'est tout ce qu'il faut au site.",
                }
