[build]
  command = "npm run maj:ffvb && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# A RETIRER LE JOUR DE LA MISE EN LIGNE REELLE
# Tant que le site montre des photos d'illustration et des contenus
# provisoires, on interdit aux moteurs de recherche de l'enregistrer.
# Sans cela, "Joueur 1" et les partenaires sans nom resteraient dans les
# resultats Google apres le lancement, en concurrence avec le vrai domaine.
# Supprimez ce bloc, et la ligne Disallow de public/robots.txt, quand le
# contenu est definitif.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
